<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С Днём Рождения, Машуля! ♥</title>
<meta name="description" content="Пиксельное поздравление с днём рождения">
<meta name="theme-color" content="#1a1033">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 10' shape-rendering='crispEdges'%3E%3Cpath fill='%23ff4d6d' d='M2 0h2v1H2zM8 0h2v1H8zM1 1h4v1H1zM7 1h4v1H7zM0 2h12v3H0zM1 5h10v1H1zM2 6h8v1H2zM3 7h6v1H3zM4 8h4v1H4zM5 9h2v1H5z'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ЗВЁЗДЫ / ФОН -->
<div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

<!-- ПАНЕЛЬ СЕРДЕЧЕК -->
<header class="hud" id="hud">
  <div class="hud-slots" id="hudSlots"></div>
  <div class="hud-count"><span id="hudCount">0</span> / <span id="hudTotal">19</span></div>
</header>

<button class="sound-btn" id="soundBtn" type="button" title="звук вкл/выкл" aria-label="звук">♪</button>

<main id="scroller">

  <!-- ИНТРО -->
  <section class="sec sec-intro" id="intro">
    <div class="intro-box">
      <div class="intro-heart" id="introHeart"></div>
      <h1 class="title">С ДНЁМ<br>РОЖДЕНИЯ,<br><span class="title-name">МАШУЛЯ!</span></h1>
      <p class="sub">собери 19 сердечек ♥</p>
      <button class="pixel-btn" id="startBtn" type="button">НАЧАТЬ</button>
    </div>
    <div class="scroll-hint">▼ листай вниз ▼</div>
  </section>

  <!-- 19 СЕКЦИЙ С ФОТО — генерируются в js/main.js -->

  <!-- ФИНАЛ -->
  <section class="sec sec-final" id="final">
    <div class="final-inner">
      <div class="big-heart-wrap" id="bigHeartWrap">
        <div class="big-heart" id="bigHeart"></div>
        <div class="flash" id="flash"></div>
      </div>
      <div class="letter" id="letter">
        <p class="letter-text" id="letterText"></p>
        <p class="sign" id="sign">— Диня —</p>
        <button class="pixel-btn small" id="againBtn" type="button">ЕЩЁ РАЗ</button>
      </div>
    </div>
  </section>

</main>

<div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

<script src="js/main.js"></script>
</body>
</html>
